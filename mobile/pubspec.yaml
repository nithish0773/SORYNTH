name: sorynth
description: "SORYNTH - Signal Beyond Boundaries. Hybrid Internet and LoRa-Based Emergency SOS Communication System."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Icons & Styling
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation & Routing
  go_router: ^14.8.1

  # Backend & Realtime Database
  supabase_flutter: ^2.8.4

  # GPS & Location Services
  geolocator: ^13.0.2

  # Device Permissions
  permission_handler: ^11.4.0

  # Hardware BLE for ESP32 & LoRa integration
  flutter_blue_plus: ^1.35.3

  # Local Persistence & Offline Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.2

  # Network Connectivity Detection
  connectivity_plus: ^6.1.4

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
